[Language_en]
Name=Performance Optimizer
Description=Reduces redundant GPU work without changing graphics settings. Also avoids idle PiP and optical-mode forwarding stages and redundant ocean readback conversions. Requires Anchor Chain. Enable this mod, then restart Sea Power.

[Language_ja]
Name=Performance Optimizer
Description=画質設定を変更せず、不要なGPU処理を削減します。PiP未使用時・光学映像モード無効時の中継コピーと、海面データの読み戻し中の重複変換処理を抑制します。Anchor Chainが必要です。有効にした後、Sea Powerを再起動してください。
