[Language_en]
Name=Performance Optimizer
Description=Reduces redundant GPU work, repeated lookups and temporary managed allocations while preserving graphics settings and simulation timing. Requires Anchor Chain. Enable this mod, then restart Sea Power.

[Language_ja]
Name=Performance Optimizer
Description=画質設定や判断頻度を変更せず、不要なGPU処理・重複探索・一時データの確保を削減します。Anchor Chainが必要です。有効にした後、Sea Powerを再起動してください。
